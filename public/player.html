<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replay surface</title>
  <link rel="stylesheet" href="/vendor/rrweb-player.css">
  <style>
    html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
    #player { width: 100%; height: 100%; }
    #msg {
      position: absolute; inset: 0; display: none; place-items: center;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #7b8794; background: #fff; padding: 24px; text-align: center;
    }
    #msg.show { display: grid; }
    /* rrweb draws its own controller; ours lives in the parent page. */
    .replayer-wrapper { margin: 0 auto; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="msg"></div>
  <script src="/vendor/rrweb.js"></script>
  <script src="/vendor/rrweb-player.js"></script>
  <script src="/player.js"></script>
</body>
</html>
